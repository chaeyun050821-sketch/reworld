<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>핸드트래킹 드로잉 & AI 도트 다듬기</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        /* 나만의 스티커 보관함 스타일 */
        .inventory-container {
            width: 640px;
            margin-top: 20px;
            background: #ffffffdd;
            padding: 15px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            box-shadow: 0 4px 12px rgba(150, 130, 190, 0.15);
            min-height: 90px;
        }
        .inventory-item-wrapper {
            position: relative;
            flex: 0 0 auto;
        }
        .inventory-item {
            width: 80px;
            height: 80px;
            border: 2px solid #E4D9F5;
            border-radius: 12px;
            cursor: pointer;
            background: white;
            object-fit: contain;
            transition: 0.2s;
            display: block;
        }
        .inventory-item:hover {
            transform: scale(1.1) translateY(-5px);
        }
        .inventory-item.selected {
            border: 4px solid #FF9AA2;
            box-shadow: 0 0 10px #FF9AA2aa;
        }
        .inventory-edit-btn, .inventory-delete-btn {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            color: #fff;
            border: 2px solid #fff;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            z-index: 2;
        }
        .inventory-edit-btn { top: -6px; right: -6px; background: #5B9BD5; }
        .inventory-delete-btn { top: -6px; left: -6px; background: #FF9AA2; }
        .inventory-item-wrapper:hover .inventory-edit-btn,
        .inventory-item-wrapper:hover .inventory-delete-btn { opacity: 1; }
        .inventory-provider-tag {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 999px;
            background: #ffffffee;
            border: 1px solid #E4D9F5;
            color: #6a5d85;
            pointer-events: none;
        }
        body {
            margin: 0;
            padding-bottom: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(160deg, #FDEFF4 0%, #E9E4F5 45%, #DCE6F7 100%);
            font-family: 'Gowun Dodum', 'Segoe UI', sans-serif;
            color: #5b5470;
            min-height: 100vh;
        }
        h1 {
            margin-top: 34px;
            font-family: 'Jua', sans-serif;
            font-size: 30px;
            color: #7c6a9c;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px #ffffffaa;
        }
        .container {
            position: relative;
            width: 640px;
            height: 480px;
            margin-top: 14px;
            border: 5px solid #ffffff;
            border-radius: 20px;
            overflow: hidden;
            background-color: #2c2c3a;
            box-shadow: 0 12px 28px rgba(150, 130, 190, 0.25);
        }
        video, canvas, #overlay_canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); 
        }
        video { object-fit: cover; background: #000; }
        canvas { z-index: 10; }
        #overlay_canvas { z-index: 15; pointer-events: none; }
        .color-palette { margin-top: 18px; display: flex; gap: 14px; }
        .color-btn {
            width: 42px; height: 42px; border-radius: 50%; border: 3px solid #ffffff;
            cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 10px rgba(150, 130, 190, 0.3);
        }
        .color-btn:hover { transform: scale(1.12) rotate(-4deg); }
        #btnRed { background-color: #FF9AA2; }
        #btnGreen { background-color: #A0E7C7; }
        #btnBlue { background-color: #A6C8FF; }
        #rainbowPickerBtn { background: conic-gradient(#FF9AA2, #FFD6A5, #FDFFB6, #A0E7C7, #A6C8FF, #C9B6F5, #FF9AA2); }
        .brush-size-control {
            margin-top: 18px; display: flex; align-items: center; gap: 12px; color: #6a5d85; font-size: 15px;
            background: #ffffffaa; padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 12px rgba(150, 130, 190, 0.15);
        }
        #brushSizeSlider, #eraserSizeSlider { width: 180px; cursor: pointer; accent-color: #C9B6F5; }
        #brushSizeValue { min-width: 40px; font-weight: bold; color: #e07a9e; }
        #eraserSizeValue { min-width: 40px; font-weight: bold; color: #7c9ec9; }
        .controls { margin-top: 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 640px; }
        .item-category-control { width: 640px; margin-top: 14px; padding: 12px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; border: 2px solid #E4D9F5; border-radius: 16px; background: #ffffffcc; box-shadow: 0 4px 12px rgba(150, 130, 190, 0.14); }
        .item-category-control label { font-size: 14px; font-weight: 700; color: #6a5d85; white-space: nowrap; }
        #itemCategory { flex: 1; padding: 9px 12px; border: 1px solid #D8C8EE; border-radius: 12px; background: white; color: #5b5470; font-family: 'Gowun Dodum', sans-serif; font-weight: 700; outline: none; }
        .action-btn {
            padding: 13px 24px; font-family: 'Gowun Dodum', sans-serif; font-size: 15px; font-weight: bold;
            cursor: pointer; border: none; border-radius: 16px; transition: 0.2s; box-shadow: 0 4px 10px rgba(150, 130, 190, 0.25); color: white;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(150, 130, 190, 0.35); }
        .action-btn:disabled { background-color: #b8c9da !important; cursor: not-allowed; opacity: 0.65; transform: none; box-shadow: none; }
        #saveBtn { background-color: #FFC48C; }
        #saveBtn:hover { background-color: #ffb266; }
        #clearBtn { background-color: #B8B8D1; }
        #clearBtn:hover { background-color: #a3a3c2; }
        #aiRefineBtn { background-color: #C9B6F5; }
        #aiRefineBtn:hover { background-color: #b49ceb; }
        #saveAiBtn { background-color: #7FD8BE; }
        #saveAiBtn:hover { background-color: #5cc9aa; }
        #canvasOnBtn { background-color: #A6C8FF; }
        #canvasOnBtn:hover { background-color: #8bb6f7; }
        #canvasOffBtn { background-color: #FF9AA2; }
        #canvasOffBtn:hover { background-color: #ff7f89; }
        .status { margin-top: 16px; font-size: 15px; color: #a3729c; font-weight: bold; background: #ffffffaa; padding: 8px 18px; border-radius: 20px; }
        .prompt-container { margin-top: 22px; width: 640px; display: flex; gap: 10px; }
        #customPrompt { flex: 1; padding: 13px 16px; font-family: 'Gowun Dodum', sans-serif; font-size: 15px; border-radius: 14px; border: 2px solid #E4D9F5; outline: none; transition: 0.2s; background: #ffffffdd; color: #5b5470; }
        #customPrompt:focus { border-color: #C9B6F5; box-shadow: 0 0 0 3px #C9B6F544; }
        #applyPromptBtn { background-color: #A6C8FF; }
        #applyPromptBtn:hover { background-color: #8bb6f7; }
        .top-bar { position: sticky; top: 0; z-index: 100; width: 100%; display: flex; justify-content: center; padding: 10px 16px; background: rgba(255, 255, 255, 0.94); border-bottom: 1px solid rgba(124, 106, 156, 0.18); box-sizing: border-box; box-shadow: 0 2px 10px rgba(150, 130, 190, 0.12); }
        #backToDiaryBtn { font-family: 'Gowun Dodum', sans-serif; font-size: 14px; font-weight: 700; color: #7c6a9c; background: #fff; border: 2px solid #E4D9F5; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
        #backToDiaryBtn:hover { color: #5a4a78; border-color: #C9B6F5; background: #faf7ff; }
        .loading-container { width: 80%; height: 12px; background-color: #eee3f7; border-radius: 6px; margin: 15px auto; overflow: hidden; border: 1px solid #d8c8ee; }
        .loading-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #FFC48C, #C9B6F5); animation: loading 2s infinite linear; }
        @keyframes loading { 0% { width: 0%; transform: translateX(-100%); } 100% { width: 100%; transform: translateX(100%); } }
    </style>
</head>
<body>
    <div class="top-bar">
        <button type="button" id="backToDiaryBtn">← 다이어리로 돌아가기</button>
    </div>
    <h1>Re:world Drawing</h1>
    <div class="status" id="statusText">웹캠과 AI 모델을 불러오는 중입니다. 잠시만 기다려주세요...</div>
    <div class="container">
        <video id="input_video" autoplay playsinline muted></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
        <canvas id="overlay_canvas" width="640" height="480"></canvas>
    </div>
    <div class="color-palette">
        <button class="color-btn" id="btnRed" title="빨간색"></button>
        <button class="color-btn" id="btnGreen" title="초록색"></button>
        <button class="color-btn" id="btnBlue" title="파란색"></button>
        <button class="color-btn" id="rainbowPickerBtn" title="자유롭게 색상 고르기"></button>
        <input type="color" id="customColorPicker" style="opacity: 0; position: absolute; pointer-events: none;">
        <button class="color-btn" id="btnEraser" title="부분 지우개" style="background-color: #fff; border: 3px dashed #C9B6F5; font-size: 20px; display: flex; justify-content: center; align-items: center;">🧽</button>
    </div>
    <div class="brush-size-control">
        <span>펜 굵기:</span>
        <input type="range" id="brushSizeSlider" min="2" max="30" value="6">
        <span id="brushSizeValue">6px</span>
        <span style="margin-left: 20px;">🧽 지우개 굵기:</span>
        <input type="range" id="eraserSizeSlider" min="10" max="100" value="20">
        <span id="eraserSizeValue">20px</span>
    </div>
    <div class="controls">
        <button class="action-btn" id="saveBtn">💾 사진 찍기</button>
        <button class="action-btn" id="canvasOnBtn">✏️ ON (Space)</button>
        <button class="action-btn" id="canvasOffBtn">✏️ OFF (Space)</button>
        <button class="action-btn" id="clearBtn">🗑️ 펜 그림 지우기</button>
        <button class="action-btn" id="aiRefineBtn">✨ 도트 변환</button>
        <button class="action-btn" id="saveAiBtn">🖼️ 도트 그림 저장</button>
        <button class="action-btn" id="addToInventoryBtn" style="background-color: #FFD6A5;">🎒 보관함에 넣기</button>
    </div>
    <div class="item-category-control">
        <label for="itemCategory">내 아이템 분류</label>
        <select id="itemCategory" aria-label="생성 아이템 분류">
            <option value="헤어">헤어</option>
            <option value="얼굴">얼굴</option>
            <option value="의상">의상</option>
            <option value="악세사리" selected>악세사리</option>
            <option value="기타">기타</option>
        </select>
    </div>
    <div class="prompt-container">
        <input type="text" id="customPrompt" placeholder="예: 테두리 다듬어줘 / 그라데이션 / 안을 분홍으로">
        <button class="action-btn" id="applyPromptBtn">💬 수정하기</button>
    </div>
    <div id="svgOutput" style="margin-top: 22px; width: 640px; min-height: 200px; border: 2px dashed #C9B6F5; border-radius: 18px; display: flex; justify-content: center; align-items: center; background-color: #ffffffcc; padding: 20px; box-sizing: border-box;">
        <p style="color: #8a7ba3; text-align: center; line-height: 1.7; font-size: 15px;">
            1. 허공에 그림을 먼저 그리세요.<br>
            2. <b>✨ 도트 변환</b>은 그린 그림을 그대로 로컬 픽셀화합니다 (AI·크레딧 없음).<br>
            3. 수정 요청을 적고 <b>💬 수정하기</b>를 누르면 AI가 도트 그림을 다듬습니다!
        </p>
    </div>
    <div class="inventory-container" id="inventory">
        <span style="color:#8a7ba3; font-weight:bold; line-height:80px; text-align:center; width:100%;">
            여기에 나만의 도트 스티커가 모입니다! (그림을 변환하고 '보관함에 넣기'를 누르세요)
        </span>
    </div>
    <div id="historyContainer" style="width: 640px; margin-top: 10px; font-size: 14px; color: #8a7ba3; text-align: left; max-height: 100px; overflow-y: auto;"></div>

    <script type="module">
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const overlayCanvas = document.getElementById('overlay_canvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const statusText = document.getElementById('statusText');

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const bigint = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
            const r = (bigint >> 16) & 255;
            const g = (bigint >> 8) & 255;
            const b = bigint & 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function drawPenNib(ctx, x, y, color, isDown, sizeScale = 1) {
            const w = 8 * sizeScale;   
            const h = 24 * sizeScale;  
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-w, -h * 0.45, -w * 0.7, -h, 0, -h);
            ctx.bezierCurveTo(w * 0.7, -h, w, -h * 0.45, 0, 0);
            ctx.closePath();
            if (isDown) {
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
            } else {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
                ctx.strokeStyle = color;
                ctx.setLineDash([4, 3]);
            }
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(0, -h * 0.15);
            ctx.lineTo(0, -h * 0.9);
            ctx.strokeStyle = isDown ? 'rgba(255,255,255,0.9)' : color;
            ctx.lineWidth = 1.4;
            ctx.stroke();
            ctx.restore();
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        let isDrawing = false;
        let isProcessingAI = false;
        let placedStickers = [];
        let isPinchingPrevious = false;
        let draggingStickerIndex = -1;
        let lastX = 0; let lastY = 0;
        let handLandmarker = undefined;
        let lastVideoTime = -1;
        const MIN_STICKER_SIZE = 30;
        const MAX_STICKER_SIZE = 420;
        let resizeBaselineDist = null;
        let resizeBaselineSize = null;

        let cameraStream = null;
        let cameraReady = false;
        let modelReady = false;
        let predictLoopStarted = false;

        function updateReadyStatus() {
            if (cameraReady && modelReady) {
                statusText.innerText = "✅ 준비 완료! 색상이나 🧽지우개를 선택하고 그려보세요.";
                statusText.style.color = "#a3729c";
            } else if (cameraReady) {
                statusText.innerText = "웹캠 연결됨. AI 손 인식 모델 로딩 중...";
                statusText.style.color = "#a3729c";
            }
        }

        function maybeStartPredictLoop() {
            if (!cameraReady || !modelReady || predictLoopStarted) return;
            predictLoopStarted = true;
            predictWebcam();
        }

        function showCameraRetryButton() {
            if (document.getElementById("cameraRetryBtn")) return;
            const btn = document.createElement("button");
            btn.id = "cameraRetryBtn";
            btn.type = "button";
            btn.textContent = "📷 웹캠 다시 켜기";
            btn.className = "action-btn";
            btn.style.cssText = "margin-top:12px;background:#5B9BD5;grid-column:1/-1;";
            btn.onclick = () => {
                btn.remove();
                if (cameraStream) {
                    cameraStream.getTracks().forEach((track) => track.stop());
                    cameraStream = null;
                }
                cameraReady = false;
                predictLoopStarted = false;
                startCamera();
            };
            document.querySelector(".controls")?.prepend(btn);
        }

        async function createHandLandmarker() {
            statusText.innerText = "웹캠 연결 중... AI 모델도 함께 불러옵니다.";
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                const landmarkerOptions = {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    },
                    runningMode: "VIDEO",
                    numHands: 2,
                };
                try {
                    handLandmarker = await HandLandmarker.createFromOptions(vision, {
                        ...landmarkerOptions,
                        baseOptions: { ...landmarkerOptions.baseOptions, delegate: "GPU" },
                    });
                } catch {
                    handLandmarker = await HandLandmarker.createFromOptions(vision, {
                        ...landmarkerOptions,
                        baseOptions: { ...landmarkerOptions.baseOptions, delegate: "CPU" },
                    });
                }
                modelReady = true;
                updateReadyStatus();
                maybeStartPredictLoop();
            } catch (err) {
                console.error("[hand-tracking] model load failed:", err);
                statusText.innerText = "AI 모델 로드에 실패했어요. 새로고침 후 다시 시도해 주세요.";
                statusText.style.color = "#e74c3c";
            }
        }

        async function startCamera() {
            if (!navigator.mediaDevices?.getUserMedia) {
                statusText.innerText = "이 브라우저는 웹캠을 지원하지 않아요. Chrome 또는 Safari 최신 버전을 사용해 주세요.";
                statusText.style.color = "#e74c3c";
                showCameraRetryButton();
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false,
                });
                cameraStream = stream;
                videoElement.srcObject = stream;
                videoElement.muted = true;
                await videoElement.play();
                cameraReady = true;
                updateReadyStatus();
                videoElement.addEventListener("loadeddata", maybeStartPredictLoop, { once: true });
                if (videoElement.readyState >= 2) maybeStartPredictLoop();
            } catch (err) {
                console.error("[hand-tracking] camera failed:", err);
                const name = err?.name || "";
                if (name === "NotAllowedError" || name === "PermissionDeniedError") {
                    statusText.innerText = "웹캠 권한이 거부됐어요. 주소창 🔒에서 카메라를 '허용'으로 바꾼 뒤 아래 버튼을 눌러 주세요.";
                } else if (name === "NotFoundError" || name === "DevicesNotFoundError") {
                    statusText.innerText = "연결된 카메라를 찾을 수 없어요. 웹캠 연결을 확인해 주세요.";
                } else {
                    statusText.innerText = "웹캠을 켤 수 없어요. 다른 앱에서 카메라를 쓰고 있지 않은지 확인해 주세요.";
                }
                statusText.style.color = "#e74c3c";
                showCameraRetryButton();
            }
        }

        startCamera();
        createHandLandmarker();

        async function predictWebcam() {
            if (!handLandmarker) return;
            let startTimeMs = performance.now();

            if (lastVideoTime !== videoElement.currentTime) {
                lastVideoTime = videoElement.currentTime;
                const results = handLandmarker.detectForVideo(videoElement, startTimeMs);

                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                placedStickers.forEach((sticker) => {
                    overlayCtx.save();
                    overlayCtx.translate(sticker.x + sticker.size / 2, sticker.y + sticker.size / 2);
                    overlayCtx.scale(-1, 1);
                    overlayCtx.drawImage(sticker.img, -sticker.size / 2, -sticker.size / 2, sticker.size, sticker.size);
                    overlayCtx.restore();
                });

                if (results.landmarks && results.landmarks.length > 0 && !isProcessingAI) {
                    if (statusText.innerText.includes("화면 밖으로")) {
                        statusText.innerText = "✅ 준비 완료! 색상이나 🧽지우개를 선택하고 그려보세요.";
                        statusText.style.color = "#a3729c"; 
                    }
                    const landmarks = results.landmarks[0]; 
                    const secondHandLandmarks = results.landmarks.length > 1 ? results.landmarks[1] : null; 
                    const indexTip = landmarks[8];
                    const thumbTip = landmarks[4];

                    const indexX = indexTip.x * canvasElement.width;
                    const indexY = indexTip.y * canvasElement.height;
                    const thumbX = thumbTip.x * canvasElement.width;
                    const thumbY = thumbTip.y * canvasElement.height;

                    const pinchDist = Math.hypot(indexX - thumbX, indexY - thumbY);
                    const PINCH_THRESHOLD = 70; 
                    const isPinching = pinchDist < PINCH_THRESHOLD;
                    
                    if (isPinching && !isPinchingPrevious) {
                        for (let i = placedStickers.length - 1; i >= 0; i--) {
                            const s = placedStickers[i];
                            if (indexX >= s.x && indexX <= s.x + s.size && indexY >= s.y && indexY <= s.y + s.size) {
                                draggingStickerIndex = i;
                                break;
                            }
                        }
                    }
                    
                    if (isPinching && draggingStickerIndex !== -1) {
                        placedStickers[draggingStickerIndex].x = indexX - (placedStickers[draggingStickerIndex].size / 2);
                        placedStickers[draggingStickerIndex].y = indexY - (placedStickers[draggingStickerIndex].size / 2);
                    }

                    if (isPinching && draggingStickerIndex !== -1 && secondHandLandmarks) {
                        const t2 = secondHandLandmarks[4];
                        const i2 = secondHandLandmarks[8];
                        const t2x = t2.x * canvasElement.width, t2y = t2.y * canvasElement.height;
                        const i2x = i2.x * canvasElement.width, i2y = i2.y * canvasElement.height;
                        const secondPinchDist = Math.hypot(i2x - t2x, i2y - t2y);

                        if (resizeBaselineDist === null) {
                            resizeBaselineDist = secondPinchDist;
                            resizeBaselineSize = placedStickers[draggingStickerIndex].size;
                        } else {
                            const delta = (secondPinchDist - resizeBaselineDist) * 1.6;
                            let newSize = resizeBaselineSize + delta;
                            newSize = Math.max(MIN_STICKER_SIZE, Math.min(MAX_STICKER_SIZE, newSize));
                            placedStickers[draggingStickerIndex].size = newSize;
                        }

                        overlayCtx.save();
                        overlayCtx.beginPath();
                        overlayCtx.moveTo(t2x, t2y);
                        overlayCtx.lineTo(i2x, i2y);
                        overlayCtx.strokeStyle = '#5B9BD5';
                        overlayCtx.lineWidth = 3;
                        overlayCtx.setLineDash([5, 4]);
                        overlayCtx.stroke();
                        overlayCtx.setLineDash([]);
                        overlayCtx.fillStyle = '#5B9BD5';
                        overlayCtx.font = '20px sans-serif';
                        overlayCtx.fillText('🔍', (t2x + i2x) / 2 - 10, (t2y + i2y) / 2 - 12);
                        overlayCtx.restore();
                    } else {
                        resizeBaselineDist = null;
                        resizeBaselineSize = null;
                    }

                    if (draggingStickerIndex !== -1) {
                        overlayCtx.save();
                        overlayCtx.fillStyle = 'rgba(255, 100, 100, 0.6)';
                        overlayCtx.beginPath();
                        overlayCtx.arc(canvasElement.width / 2, canvasElement.height, 80, 0, Math.PI * 2);
                        overlayCtx.fill();
                        overlayCtx.fillStyle = 'white';
                        overlayCtx.font = '30px Arial';
                        overlayCtx.textAlign = 'center';
                        overlayCtx.fillText('🗑️', canvasElement.width / 2, canvasElement.height - 20);
                        overlayCtx.restore();
                    }

                    if (!isPinching) {
                        if (isPinchingPrevious && draggingStickerIndex !== -1) {
                            const s = placedStickers[draggingStickerIndex];
                            const centerX = s.x + (s.size / 2);
                            const centerY = s.y + (s.size / 2);
                            const trashDist = Math.hypot(centerX - (canvasElement.width / 2), centerY - canvasElement.height);

                            if (trashDist < 80) {
                                placedStickers.splice(draggingStickerIndex, 1);
                            }
                        }
                        draggingStickerIndex = -1;
                        resizeBaselineDist = null;
                        resizeBaselineSize = null;
                    }
                    
                    isPinchingPrevious = isPinching;

                    const currentSize = isEraserMode ? eraserSize : brushSize;
                    const cursorColor = isEraserMode ? '#95a5a6' : currentColor;
                    const isDragging = (draggingStickerIndex !== -1);
                    const canActuallyDraw = isDrawingMode && !isPinching && !isDragging;

                    if (isEraserMode) {
                        overlayCtx.save();
                        overlayCtx.beginPath();
                        overlayCtx.arc(indexX, indexY, currentSize / 2 + 4, 0, 2 * Math.PI);
                        overlayCtx.setLineDash(canActuallyDraw ? [] : [5, 4]);
                        overlayCtx.fillStyle = canActuallyDraw ? 'rgba(255, 255, 255, 0.8)' : 'rgba(255, 255, 255, 0.45)';
                        overlayCtx.strokeStyle = cursorColor;
                        overlayCtx.lineWidth = 2;
                        overlayCtx.fill();
                        overlayCtx.stroke();
                        overlayCtx.setLineDash([]);
                        overlayCtx.restore();
                    } else {
                        const scale = 0.8 + Math.min(brushSize / 30, 1) * 0.6;
                        drawPenNib(overlayCtx, indexX, indexY, cursorColor, canActuallyDraw, scale);
                    }

                    if (canActuallyDraw) {
                        if (!isDrawing) {
                            isDrawing = true;
                            lastX = indexX;
                            lastY = indexY;
                        } else {
                            canvasCtx.beginPath();
                            canvasCtx.moveTo(lastX, lastY);
                            canvasCtx.lineTo(indexX, indexY);

                            if (isEraserMode) {
                                canvasCtx.globalCompositeOperation = 'destination-out';
                                canvasCtx.lineWidth = eraserSize;
                            } else {
                                canvasCtx.globalCompositeOperation = 'source-over';
                                canvasCtx.strokeStyle = currentColor;
                                canvasCtx.lineWidth = brushSize;
                            }

                            canvasCtx.lineCap = 'round';
                            canvasCtx.lineJoin = 'round';
                            canvasCtx.stroke();
                            lastX = indexX;
                            lastY = indexY;
                        }
                    } else {
                        isDrawing = false;

                } else {

                    isPinchingPrevious = false;
                    draggingStickerIndex = -1;

                    if (isDrawingMode) {
                        statusText.innerText = "✋ 화면 밖으로 손이 나갔어요! 손바닥 전체가 보이게 들어주세요.";

        const AI_CAPTURE_MAX_WIDTH = 448;
        const AI_STROKE_DILATE = 3;

        function isInkPixel(r, g, b, a) {
            if (a < 20) return false;
            return !(r > 245 && g > 245 && b > 245);
        }

        function dilateInkImageData(srcData, width, height, radius) {
            const out = new Uint8ClampedArray(srcData.length);
            for (let i = 0; i < out.length; i += 4) {
                out[i] = 255; out[i + 1] = 255; out[i + 2] = 255; out[i + 3] = 255;
            }
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    if (!isInkPixel(srcData[i], srcData[i + 1], srcData[i + 2], srcData[i + 3])) continue;
                    const r = srcData[i], g = srcData[i + 1], b = srcData[i + 2];
                    for (let dy = -radius; dy <= radius; dy++) {
                        for (let dx = -radius; dx <= radius; dx++) {
                            if (dx * dx + dy * dy > radius * radius) continue;
                            const nx = x + dx, ny = y + dy;
                            if (nx < 0 || ny < 0 || nx >= width || ny >= height) continue;
                            const j = (ny * width + nx) * 4;
                            out[j] = r; out[j + 1] = g; out[j + 2] = b; out[j + 3] = 255;
                        }
                    }
                }
            }
            return out;
        }

        function findInkBounds(data, width, height) {
            let minX = width, minY = height, maxX = -1, maxY = -1;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    if (!isInkPixel(data[i], data[i + 1], data[i + 2], data[i + 3])) continue;
                    if (x < minX) minX = x;
                    if (y < minY) minY = y;
                    if (x > maxX) maxX = x;
                    if (y > maxY) maxY = y;
                }
            }
            if (maxX < 0) return null;
            return { minX, minY, maxX, maxY };
        }

        function canvasToCompactBase64(sourceCanvas, mirror = false) {
            const prep = document.createElement('canvas');
            prep.width = sourceCanvas.width;
            prep.height = sourceCanvas.height;
            const prepCtx = prep.getContext('2d');
            prepCtx.fillStyle = '#ffffff';
            prepCtx.fillRect(0, 0, prep.width, prep.height);
            if (mirror) {
                prepCtx.translate(prep.width, 0);
                prepCtx.scale(-1, 1);
            }
            prepCtx.drawImage(sourceCanvas, 0, 0);

            const src = prepCtx.getImageData(0, 0, prep.width, prep.height);
            const dilated = dilateInkImageData(src.data, prep.width, prep.height, AI_STROKE_DILATE);
            prepCtx.putImageData(new ImageData(dilated, prep.width, prep.height), 0, 0);

            const bounds = findInkBounds(dilated, prep.width, prep.height);
            let sx = 0, sy = 0, sw = prep.width, sh = prep.height;
            if (bounds) {
                const padX = Math.max(8, Math.round((bounds.maxX - bounds.minX) * 0.12));
                const padY = Math.max(8, Math.round((bounds.maxY - bounds.minY) * 0.12));
                sx = Math.max(0, bounds.minX - padX);
                sy = Math.max(0, bounds.minY - padY);
                const ex = Math.min(prep.width, bounds.maxX + padX + 1);
                const ey = Math.min(prep.height, bounds.maxY + padY + 1);
                sw = Math.max(1, ex - sx);
                sh = Math.max(1, ey - sy);
            }

            const scale = Math.min(1, AI_CAPTURE_MAX_WIDTH / Math.max(sw, sh));
            const width = Math.max(1, Math.round(sw * scale));
            const height = Math.max(1, Math.round(sh * scale));
            const out = document.createElement('canvas');
            out.width = width;
            out.height = height;
            const outCtx = out.getContext('2d');
            outCtx.imageSmoothingEnabled = false;
            outCtx.fillStyle = '#ffffff';
            outCtx.fillRect(0, 0, width, height);
            outCtx.drawImage(prep, sx, sy, sw, sh, 0, 0, width, height);
            return out.toDataURL('image/jpeg', 0.92).split(',')[1];
        }

        function captureCanvasBase64() {
            return canvasToCompactBase64(canvasElement, true);
        }

        let lastDotSvgMarkup = '';

        function captureSvgBase64(svgElement) {
            return new Promise((resolve, reject) => {
                const clone = svgElement.cloneNode(true);
                const vb = (clone.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
                let outW = 360;
                let outH = 270;
                if (vb.length === 4 && vb[2] > 0 && vb[3] > 0) {
                    outW = Math.min(360, Math.max(128, Math.round(vb[2] * 3)));
                    outH = Math.min(360, Math.max(96, Math.round(vb[3] * 3)));
                }
                clone.setAttribute('width', String(outW));
                clone.setAttribute('height', String(outH));
                if (!clone.getAttribute('xmlns')) {
                    clone.setAttribute('xmlns', '[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)');
                }

                const svgData = new XMLSerializer().serializeToString(clone);
                const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);
                const img = new Image();
                img.onload = () => {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = outW;
                    tempCanvas.height = outH;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.imageSmoothingEnabled = false;
                    tempCtx.fillStyle = '#ffffff';
                    tempCtx.fillRect(0, 0, outW, outH);
                    tempCtx.drawImage(img, 0, 0, outW, outH);
                    URL.revokeObjectURL(url);
                    resolve(canvasToCompactBase64(tempCanvas, false));
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('도트 그림을 불러오지 못했어요. 다시 도트 변환 후 수정해 주세요.'));
                };
                img.src = url;
            });
        }

        function captureImageElementBase64(imgEl) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvasElement.width;
            tempCanvas.height = canvasElement.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
            tempCtx.drawImage(imgEl, 0, 0, tempCanvas.width, tempCanvas.height);
            return canvasToCompactBase64(tempCanvas, false);
        }

        function isCanvasBlank() {
            const pixels = canvasCtx.getImageData(0, 0, canvasElement.width, canvasElement.height).data;
            for (let i = 3; i < pixels.length; i += 4) {

            }
            return true;
        }

        // 도트 변환: AI 없이 캔버스 획만 격자 샘플링 → SVG <rect>
        function pixelateDrawingToSvg(sourceCanvas, mirror = true, cellSize = 4) {
            const w = sourceCanvas.width;
            const h = sourceCanvas.height;
            const prep = document.createElement('canvas');
            prep.width = w;
            prep.height = h;
            const prepCtx = prep.getContext('2d');
            if (mirror) {
                prepCtx.translate(w, 0);
                prepCtx.scale(-1, 1);
            }
            prepCtx.drawImage(sourceCanvas, 0, 0);
            const { data } = prepCtx.getImageData(0, 0, w, h);

            const cols = Math.ceil(w / cellSize);
            const rows = Math.ceil(h / cellSize);
            const parts = [
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${cols} ${rows}" width="100%" height="100%" shape-rendering="crispEdges">`,
            ];

            for (let gy = 0; gy < rows; gy++) {
                let runX = -1;
                let runColor = '';
                let runLen = 0;

                const flushRun = () => {
                    if (runLen <= 0) return;
                    parts.push(`<rect x="${runX}" y="${gy}" width="${runLen}" height="1" fill="${runColor}"/>`);
                    runX = -1;
                    runColor = '';
                    runLen = 0;
                };

                for (let gx = 0; gx < cols; gx++) {
                    let rSum = 0, gSum = 0, bSum = 0, count = 0;
                    const x0 = gx * cellSize;
                    const y0 = gy * cellSize;
                    const x1 = Math.min(w, x0 + cellSize);
                    const y1 = Math.min(h, y0 + cellSize);
                    const cellArea = (x1 - x0) * (y1 - y0);

                    for (let y = y0; y < y1; y++) {
                        for (let x = x0; x < x1; x++) {
                            const i = (y * w + x) * 4;
                            if (data[i + 3] < 40) continue;
                            rSum += data[i];
                            gSum += data[i + 1];
                            bSum += data[i + 2];
                            count++;
                        }
                    }

                    // 칸의 일정 비율 이상 칠해져야 픽셀로 인정
                    if (count < Math.max(2, cellArea * 0.12)) {
                        flushRun();
                        continue;
                    }

                    const r = Math.round(rSum / count);
                    const g = Math.round(gSum / count);
                    const b = Math.round(bSum / count);
                    const hex = `#${[r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('')}`;

                    if (runLen > 0 && hex === runColor && gx === runX + runLen) {
                        runLen += 1;
                    } else {
                        flushRun();
                        runX = gx;
                        runColor = hex;
                        runLen = 1;
                    }
                }
                flushRun();
            }

            parts.push('</svg>');
            return parts.join('');
        }

            const imageBase64 = captureCanvasBase64();

            isProcessingAI = true;

            try {

                    }),

                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    const apiMessage = data?.error || (response.status === 504
                        ? '응답 시간이 초과됐어요. 잠시 후 다시 시도해 주세요.'
                        : `HTTP ${response.status}`);
                    throw new Error(apiMessage);
                }
                if (!data?.svg) {

                if (beforeKey === afterKey) {

                if (lastDotSvgMarkup) {

                }
            } finally {
                isProcessingAI = false;
            }
        }

        });

        document.getElementById('canvasOnBtn').addEventListener('click', () => {
            setDrawingMode(true);
        });

        document.getElementById('canvasOffBtn').addEventListener('click', () => {
            setDrawingMode(false);
        });

        function setDrawingMode(on) {
            isDrawingMode = on;
            isDrawing = false;
            statusText.innerText = on
                ? "✅ 펜 모드 ON! 허공에 그림을 그려보세요. (스페이스바로도 켜고 끌 수 있어요)"
                : "🚫 펜 모드 OFF! 손을 움직여도 그려지지 않아요. (스페이스바로도 켜고 끌 수 있어요)";
        }

        window.addEventListener('keydown', (e) => {
            if (e.code !== 'Space') return;
            const activeTag = document.activeElement ? document.activeElement.tagName : '';
            if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;
            e.preventDefault();
            setDrawingMode(!isDrawingMode);
        });

        const HANDMADE_KEY_PREFIX = 'reworld_handmade_';
        const STICKER_STORAGE_KEY = 'myArStickers_v2';
        const LEGACY_STICKER_STORAGE_KEY = 'myArStickers';
        const pageParams = new URLSearchParams(window.location.search);
        let diaryUserId = pageParams.get('userId') || '';
        if (!diaryUserId) {
            try {
                diaryUserId = sessionStorage.getItem('reworld_hand_tracking_user_id') || '';
            } catch {
                diaryUserId = '';
            }
        }

        function getDiaryReturnUrl() {
            const fromQuery = pageParams.get('return');
            if (fromQuery) return fromQuery;
            try {
                const stored = sessionStorage.getItem('reworld_hand_tracking_return');
                if (stored) return stored;
            } catch {
            }
            return new URL('../', window.location.href).href;
        }

        document.getElementById('backToDiaryBtn').addEventListener('click', () => {
            try {
                sessionStorage.setItem('reworld_diary_restore', 'spread');
            } catch {
            }
            window.location.href = getDiaryReturnUrl();
        });

        function persistDiaryHandMadeItem(svgData) {
            if (!diaryUserId) return false;
            try {
                const key = HANDMADE_KEY_PREFIX + diaryUserId;
                const existing = JSON.parse(localStorage.getItem(key) || '[]');
                const avatarCount = existing.filter((entry) => entry.type === 'avatar').length;
                const category = document.getElementById('itemCategory').value || '기타';
                const item = {
                    id: 'custom-' + Date.now(),
                    type: 'avatar',
                    label: '만든 아이템 ' + (avatarCount + 1),
                    cat: category,
                    color: '#b08a4a',
                    source: 'handmade',
                    artStyle: 'pixel',
                    imageDataUrl: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgData),
                    createdAt: new Date().toISOString(),
                };
                const next = [item, ...existing.filter((entry) => entry.id !== item.id)];
                localStorage.setItem(key, JSON.stringify(next));
                return true;
            } catch (error) {
                console.error('[hand-tracking] diary item save failed:', error);
                return false;
            }
        }

        let selectedSticker = null;
        const inventory = document.getElementById('inventory');

        function getStickerStorageKey() {
            return diaryUserId ? `${STICKER_STORAGE_KEY}:${diaryUserId}` : STICKER_STORAGE_KEY;
        }

        function normalizeStickerRecord(entry, fallbackId) {
            if (typeof entry === 'string' && entry.includes('<svg')) {
                return { id: fallbackId, svg: entry, createdAt: null };
            }
            if (entry && typeof entry === 'object' && typeof entry.svg === 'string' && entry.svg.includes('<svg')) {
                return {
                    id: entry.id || fallbackId,
                    svg: entry.svg,
                    createdAt: entry.createdAt || null,
                };
            }
            return null;
        }

        function svgFromHandMadeImageDataUrl(imageDataUrl) {
            if (!imageDataUrl || typeof imageDataUrl !== 'string') return null;
            if (!imageDataUrl.startsWith('data:image/svg+xml')) return null;
            const comma = imageDataUrl.indexOf(',');
            if (comma < 0) return null;
            const meta = imageDataUrl.slice(0, comma);
            const data = imageDataUrl.slice(comma + 1);
            try {
                const decoded = meta.includes(';base64') ? atob(data) : decodeURIComponent(data);
                return decoded.includes('<svg') ? decoded : null;
            } catch {
                return null;
            }
        }

        function readJsonArray(key) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                console.error('[hand-tracking] storage read failed:', key, error);
                return [];
            }
        }

        function collectStickerRecordsFromSources() {
            const byId = new Map();
            const bySvg = new Map();

            const addList = (list, idPrefix) => {
                list.forEach((entry, idx) => {
                    const record = normalizeStickerRecord(entry, `${idPrefix}-${idx}-${Date.now()}`);
                    if (!record) return;
                    if (byId.has(record.id) || bySvg.has(record.svg)) return;
                    byId.set(record.id, record);
                    bySvg.set(record.svg, record);
                });
            };

            addList(readJsonArray(getStickerStorageKey()), 'user');
            if (!diaryUserId) {
                addList(readJsonArray(LEGACY_STICKER_STORAGE_KEY), 'legacy');
            }
            if (diaryUserId) {
                const handmade = readJsonArray(HANDMADE_KEY_PREFIX + diaryUserId);
                const fromDiary = handmade
                    .map((item, idx) => {
                        const svg = svgFromHandMadeImageDataUrl(item?.imageDataUrl);
                        if (!svg) return null;
                        return {
                            id: item.id || `handmade-${idx}`,
                            svg,
                            createdAt: item.createdAt || null,
                        };
                    })
                    .filter(Boolean);
                addList(fromDiary, 'handmade');
            }

            return [...byId.values()].sort((a, b) => {
                const ta = Date.parse(a.createdAt || '') || 0;
                const tb = Date.parse(b.createdAt || '') || 0;
                return tb - ta;
            });
        }

        function loadStickerRecords() {
            const merged = collectStickerRecordsFromSources();
            if (merged.length > 0) {
                saveStickerRecords(merged);
            }
            return merged;
        }

        function saveStickerRecords(records) {
            const key = getStickerStorageKey();
            try {
                localStorage.setItem(key, JSON.stringify(records));
                if (diaryUserId) {
                    try {
                        localStorage.setItem(STICKER_STORAGE_KEY, JSON.stringify(records));
                    } catch {
                    }
                }
                return true;
            } catch (error) {
                console.error('[hand-tracking] 보관함 저장 실패:', error);
                try {
                    let trimmed = records.slice(0, Math.max(1, Math.floor(records.length * 0.7)));
                    while (trimmed.length > 0) {
                        try {
                            localStorage.setItem(key, JSON.stringify(trimmed));
                            statusText.innerText = '⚠️ 저장 공간이 부족해서 최근 스티커 위주로 보관했어요.';
                            return true;
                        } catch {
                            trimmed = trimmed.slice(0, Math.max(0, trimmed.length - 1));
                        }
                    }
                } catch {
                }
                statusText.innerText = '⚠️ 보관함 저장에 실패했어요 (저장 공간을 확인해주세요).';
                return false;
            }
        }

        let stickerRecords = loadStickerRecords();

        function removeDiaryHandMadeMatching(record) {
            if (!diaryUserId || !record) return;
            try {
                const key = HANDMADE_KEY_PREFIX + diaryUserId;
                const existing = JSON.parse(localStorage.getItem(key) || '[]');
                if (!Array.isArray(existing) || existing.length === 0) return;
                const next = existing.filter((entry) => {
                    if (entry?.id && record.id && entry.id === record.id) return false;
                    const svg = svgFromHandMadeImageDataUrl(entry?.imageDataUrl);
                    if (svg && record.svg && svg === record.svg) return false;
                    return true;
                });
                if (next.length !== existing.length) {
                    localStorage.setItem(key, JSON.stringify(next));
                }
            } catch (error) {
                console.error('[hand-tracking] diary item delete failed:', error);
            }
        }

        function ensureInventoryPlaceholder() {
            if (inventory.querySelector('.inventory-item-wrapper')) return;
            let placeholder = inventory.querySelector('span');
            if (!placeholder) {
                placeholder = document.createElement('span');
                placeholder.style.cssText = 'color:#8a7ba3;font-weight:bold;line-height:80px;text-align:center;width:100%;';
                placeholder.textContent = "여기에 나만의 도트 스티커가 모입니다! (그림을 변환하고 '보관함에 넣기'를 누르세요)";
                inventory.appendChild(placeholder);
            } else {
                placeholder.style.display = '';
            }
        }

        function deleteStickerRecord(record, wrapper, imgEl) {
            if (!confirm('이 스티커를 보관함에서 삭제할까요?')) return;

            stickerRecords = stickerRecords.filter((entry) => {
                if (record.id && entry.id === record.id) return false;
                if (record.svg && entry.svg === record.svg) return false;
                return true;
            });
            saveStickerRecords(stickerRecords);
            removeDiaryHandMadeMatching(record);

            if (imgEl) {
                placedStickers = placedStickers.filter((s) => s.img !== imgEl);
            }
            if (selectedSticker === imgEl) selectedSticker = null;

            const previewSvg = svgOutput.querySelector('svg');
            if (previewSvg && record.svg) {
                const current = new XMLSerializer().serializeToString(previewSvg);
                if (current === record.svg || current.includes(record.svg.slice(0, 80))) {
                    svgOutput.innerHTML = `
                        <p style="color: #8a7ba3; text-align: center; line-height: 1.7; font-size: 15px;">
                            1. 허공에 그림을 먼저 그리세요.<br>
                            2. <b>✨ 도트 변환</b>은 그린 그림을 그대로 로컬 픽셀화합니다 (AI·크레딧 없음).<br>
                            3. 수정 요청을 적고 <b>💬 수정하기</b>를 누르면 AI가 도트 그림을 다듬습니다!
                        </p>`;
                }
            }

            wrapper.remove();
            ensureInventoryPlaceholder();
            statusText.innerText = '🗑️ 보관함에서 스티커를 삭제했어요.';
        }

        function createStickerElement(record) {
            if (!record?.svg) return;
            const svgBlob = new Blob([record.svg], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);

            const placeholder = inventory.querySelector('span');
            if (placeholder) placeholder.style.display = 'none';

            const wrapper = document.createElement('div');
            wrapper.className = 'inventory-item-wrapper';
            wrapper.dataset.stickerId = record.id || '';

            const img = new Image();
            img.src = url;
            img.className = 'inventory-item';
            img.title = '클릭하면 도장으로 선택돼요';

            img.addEventListener('click', () => {
                document.querySelectorAll('.inventory-item').forEach(el => el.classList.remove('selected'));
                img.classList.add('selected');
                selectedSticker = img;
                statusText.innerText = "✅ 스티커 준비 완료! 마우스로 화면을 클릭해 붙이거나, 손가락으로 집어 옮겨보세요.";
            });

            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'inventory-delete-btn';
            deleteBtn.innerText = '🗑️';
            deleteBtn.title = '보관함에서 삭제';
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteStickerRecord(record, wrapper, img);
            });

            const editBtn = document.createElement('button');
            editBtn.type = 'button';
            editBtn.className = 'inventory-edit-btn';
            editBtn.innerText = '✏️';
            editBtn.title = '이 그림을 불러와서 AI로 수정하기';
            editBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                svgOutput.innerHTML = record.svg;
                statusText.innerText = '✏️ 보관함 그림을 불러왔어요! 💬 수정하기로 다듬어보세요.';
                window.scrollTo({ top: svgOutput.offsetTop - 20, behavior: 'smooth' });
            });

            const tag = document.createElement('span');
            tag.className = 'inventory-provider-tag';
            tag.innerText = '✨';

            wrapper.appendChild(img);
            wrapper.appendChild(deleteBtn);
            wrapper.appendChild(editBtn);
            wrapper.appendChild(tag);
            inventory.appendChild(wrapper);
        }

        stickerRecords.forEach((record) => {
            createStickerElement(record);
        });
        if (stickerRecords.length > 0) {
            statusText.innerText = `🎒 보관함에서 스티커 ${stickerRecords.length}개를 불러왔어요.`;
        }

        document.getElementById('addToInventoryBtn').addEventListener('click', () => {
            const svgElement = svgOutput.querySelector('svg');
            if (!svgElement) {
                alert('보관함에 넣을 AI 그림이 없어요! 먼저 ✨ 변환하기를 눌러주세요.');
                return;
            }

            const svgData = new XMLSerializer().serializeToString(svgElement);
            const record = {
                id: 'sticker-' + Date.now(),
                svg: svgData,
                createdAt: new Date().toISOString(),
            };

            createStickerElement(record);

            stickerRecords = [record, ...stickerRecords.filter((r) => r.svg !== svgData)];
            const saved = saveStickerRecords(stickerRecords);

            const syncedToDiary = persistDiaryHandMadeItem(svgData);
            statusText.innerText = syncedToDiary
                ? '🎒 보관함에 저장했어요! 다이어리 「내 아이템」에서도 볼 수 있어요.'
                : (saved ? '🎒 보관함에 저장했어요!' : '🎒 화면엔 추가했지만 영구 저장에는 실패했어요.');
        });

        let mouseDraggingIndex = -1;
        let mouseDragOffsetX = 0;
        let mouseDragOffsetY = 0;
        let mouseInteractionHappened = false; 

        function getMirroredCanvasPoint(e) {
            const rect = canvasElement.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            const realX = canvasElement.width - clickX;
            return { x: realX, y: clickY };
        }

        function findStickerAt(x, y) {
            for (let i = placedStickers.length - 1; i >= 0; i--) {
                const s = placedStickers[i];
                if (x >= s.x && x <= s.x + s.size && y >= s.y && y <= s.y + s.size) {
                    return i;
                }
            }
            return -1;
        }

        canvasElement.addEventListener('mousedown', (e) => {
            const { x, y } = getMirroredCanvasPoint(e);
            const hitIndex = findStickerAt(x, y);
            if (hitIndex !== -1) {
                mouseDraggingIndex = hitIndex;
                mouseDragOffsetX = x - placedStickers[hitIndex].x;
                mouseDragOffsetY = y - placedStickers[hitIndex].y;
                mouseInteractionHappened = true;
            } else {
                mouseInteractionHappened = false;
            }
        });

        canvasElement.addEventListener('mousemove', (e) => {
            if (mouseDraggingIndex === -1) return;
            const { x, y } = getMirroredCanvasPoint(e);
            placedStickers[mouseDraggingIndex].x = x - mouseDragOffsetX;
            placedStickers[mouseDraggingIndex].y = y - mouseDragOffsetY;
        });

        window.addEventListener('mouseup', () => {
            mouseDraggingIndex = -1;
        });

        canvasElement.addEventListener('wheel', (e) => {
            const { x, y } = getMirroredCanvasPoint(e);
            const hitIndex = findStickerAt(x, y);
            if (hitIndex === -1) return;
            e.preventDefault();
            const delta = -e.deltaY * 0.15;
            let newSize = placedStickers[hitIndex].size + delta;
            newSize = Math.max(MIN_STICKER_SIZE, Math.min(MAX_STICKER_SIZE, newSize));
            placedStickers[hitIndex].size = newSize;
        }, { passive: false });

        canvasElement.addEventListener('click', (e) => {
            if (mouseInteractionHappened) {
                mouseInteractionHappened = false;
                return;
            }

            if (!selectedSticker) return; 

            const { x: realX, y: clickY } = getMirroredCanvasPoint(e);
            const stickerSize = 180;

            placedStickers.push({
                img: selectedSticker,
                x: realX - (stickerSize / 2),
                y: clickY - (stickerSize / 2),
                size: stickerSize
            });
        });

        window.addEventListener('keydown', (e) => {
            const activeIndex = draggingStickerIndex !== -1 ? draggingStickerIndex : mouseDraggingIndex;
            if (activeIndex !== -1) {
                if (e.key === 'ArrowUp') {
                    placedStickers[activeIndex].size = Math.min(MAX_STICKER_SIZE, placedStickers[activeIndex].size + 15);
                    e.preventDefault();
                } else if (e.key === 'ArrowDown') {
                    placedStickers[activeIndex].size = Math.max(MIN_STICKER_SIZE, placedStickers[activeIndex].size - 15);
                    e.preventDefault();
                } else if (e.key === 'Backspace' || e.key === 'Delete') {
                    placedStickers.splice(activeIndex, 1);
                    draggingStickerIndex = -1;
                    mouseDraggingIndex = -1;
                    e.preventDefault();
                }
            }
        });
    </script>
</body>
</html>
