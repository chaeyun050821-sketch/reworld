name: Supabase keep-alive

# 무료 Supabase 프로젝트는 약 일주일 동안 요청이 없으면 일시정지된다.
# 일주일에 두 번(월·목 오전 9시 KST) 가벼운 조회 요청을 보내 DB가 멈추지 않게 한다.
on:
  schedule:
    - cron: "0 0 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY 저장소 Secret이 설정되지 않았습니다." >&2
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/shop_listings?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase 응답 코드: $status"
          if [ "$status" -ge 400 ]; then
            exit 1
          fi
